[metadata]
name = metadata_parser
version = attr: metadata_parser.__VERSION__
description = A module to parse metadata out of urls and html documents
long_description = file: README.rst
long_description_content_type = text/x-rst
classifiers =
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Topic :: Text Processing :: Markup :: HTML
    Topic :: Software Development :: Libraries :: Python Modules
keywords = metadata, opengraph protocol, facebook
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/metadata_parser
license = MIT

[options]
python_requires = >=3.10
packages = find:
package_dir =
    = src
include_package_data = True
zip_safe = False
install_requires =
    BeautifulSoup4>4.13.0,<4.14.0
    requests>=2.19.1
    requests-toolbelt>=0.8.0
    setuptools
    tldextract<6.0.0
    legacy-cgi; python_version >= "3.13"

[options.packages.find]
where = src

[options.package_data]
metadata_parser = py.typed

[options.extras_require]
testing =
    httpbin
    flake8
    flake8-import-order>=0.19.2
    flask<3.0
    lxml
    pytest
    pytest-cov
    pytest-httpbin
    responses
    types-beautifulsoup4
    types-requests
    werkzeug<3.0
testing-backends =
    %(testing)s
    html5lib

[flake8]
application_import_names = metadata_parser
import_order_style = appnexus
exclude = .eggs/*, .pytest_cache/*, .tox/*, build/*, dist/*, workspace-demos/*
max_line_length = 88

# ignore = E402,E501,W503
# E501: line too long
# F401: imported but unused
# I202: Additional newline in a group of imports
per-file-ignores =
	src/metadata_parser/__init__.py: E501
	src/metadata_parser/regex.py: E501
	tests/*: E501
	tests/_compat.py: F401

[mypy]
check_untyped_defs = True
exclude = ^workspace-demos\/
disable_error_code = index

[mypy-httpbin.*]
ignore_missing_imports = True

[mypy-pytest_httpbin.*]
ignore_missing_imports = True

[mypy-requests_toolbelt.*]
ignore_missing_imports = True

[tool:pytest]
addopts = --cov=metadata_parser --cov-report=term-missing
markers =
    html5_entities: exhaustive HTML5 entity checks, enabled with --html5-entities
# registered_domain; tldextract is pinned to <6.0.0
filterwarnings =
    ignore:The 'registered_domain' property is deprecated and will be removed in the next major version.:DeprecationWarning

[tox:tox]
envlist =
    lint,
    mypy,
    py310,py311,py312,py313,py314,py315

[testenv]
commands =
    python --version
    pytest {posargs:}
extras =
    testing
